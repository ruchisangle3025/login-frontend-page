<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .diamond {
            width: 50px;
            height: 50px;
            position: relative;
            left: 0;
            margin-bottom: 20px;
            animation-name: moveRight;
            animation-duration: 2s;
            animation-iteration-count: infinite;
        }
        
        .diamond {
            background: #e74c3c;
            transform: rotate(45deg);
        }
        
        @keyframes moveRight {
            to {
                left: calc(100% - 50px);
            }
        }
    </style>
</head>

<body>

    <h2>Linear (Dimaond)</h2>
    <div class="dimaond" style="animation-timing-function:linear;"></div>

    <h2>Ease (Diamond)</h2>
    <div class="diamond" style="animation-timing-function:ease;"></div>

    <h2>Ease-In (Diamond)</h2>
    <div class="diamond" style="animation-timing-function:ease-in;"></div>

    <h2>Ease-Out (diamond)</h2>
    <div class="diamond" style="animation-timing-function:ease-out;"></div>

    <h2>Ease-In-Out (diamond)</h2>
    <div class="diamond" style="animation-timing-function:ease-in-out;"></div>

    <h2>Cubic-Bezier (diamond)</h2>
    <div class="diamond" style="animation-timing-function:cubic-bezier(0.25,0.1,0.25,1);"></div>

</body>

</html>
