<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <!-- Main Card Container -->
  <div class="flex flex-col md:flex-row w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden min-h-[500px]">
    
    <!-- Left Section: Branding / Welcome Panel -->
    <div class="w-full md:w-1/2 bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-900 p-8 text-white flex flex-col justify-between items-center text-center relative">
      <!-- Background decorative circle -->
      <div class="absolute -top-10 -left-10 w-40 h-40 bg-white/10 rounded-full blur-xl"></div>
      
      <div class="my-auto space-y-6 w-full max-w-xs z-10">
        <h2 class="text-3xl font-bold tracking-wide">Get Started</h2>
        <p class="text-blue-100 text-sm">Choose an option below to continue to your dashboard.</p>
        
        <!-- Social Login Buttons -->
        <div class="space-y-3 pt-4">
          <button class="w-full py-2.5 px-4 bg-white/10 hover:bg-white/20 border border-white/30 rounded-lg text-sm font-medium transition duration-200 flex items-center justify-center gap-2">
            Sign in with Google+
          </button>
          <button class="w-full py-2.5 px-4 bg-white/10 hover:bg-white/20 border border-white/30 rounded-lg text-sm font-medium transition duration-200 flex items-center justify-center gap-2">
            Sign in with Facebook
          </button>
        </div>
      </div>
    </div>

    <!-- Right Section: Login Form -->
    <div class="w-full md:w-1/2 p-8 md:p-12 bg-white flex flex-col justify-between">
      
      <!-- Top Toggle Tabs -->
      <div class="flex justify-end gap-3 text-sm font-semibold">
        <span class="text-gray-400 cursor-pointer hover:text-gray-600">Login</span>
        <a href="#" class="bg-blue-600 text-white px-3 py-1 rounded-md text-xs hover:bg-blue-700 transition">Register</a>
      </div>

      <!-- Main Form Area -->
      <div class="my-auto space-y-6">
        <h1 class="text-2xl font-bold text-gray-800">Log In</h1>
        
        <form action="#" method="POST" class="space-y-6">
          <!-- User Name Input -->
          <div class="space-y-1">
            <label for="username" class="text-xs font-semibold text-gray-500 uppercase tracking-wider">User Name</label>
            <input 
              type="text" 
              id="username" 
              name="username" 
              placeholder="e.g. JohnDoe"
              required 
              class="w-full py-2 border-b-2 border-gray-300 focus:border-blue-600 outline-none transition text-gray-800 text-sm placeholder-gray-400"
            />
          </div>

          <!-- Password Input -->
          <div class="space-y-1">
            <label for="password" class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Password</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="••••••••"
              required 
              class="w-full py-2 border-b-2 border-gray-300 focus:border-blue-600 outline-none transition text-gray-800 text-sm placeholder-gray-400"
            />
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-xl transition duration-200 focus:ring-2 focus:ring-blue-400"
          >
            Sign In
          </button>
        </form>
      </div>

      <!-- Footer Links -->
      <div class="flex justify-between items-center text-xs text-gray-500 pt-4">
        <a href="#" class="hover:underline hover:text-blue-600">Forgot Password?</a>
        <a href="#" class="hover:underline hover:text-blue-600">Not a Member yet?</a>
      </div>

    </div>

  </div>

</body>
</html>
