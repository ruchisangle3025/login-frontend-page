<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login</title>
    <link rel="stylesheet" href="student.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <main class="login-page">
        <section class="illustration-section">
            <div class="overlay">
                <div class="brand">
                    <div class="brand-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span>EduPortal</span>
                </div>

                <div class="welcome-text">
                    <h1>Learn. Grow.<br />Achieve.</h1>
                    <p>
                        Access your classes, assignments, results, and student resources from one secure portal.
                    </p>
                </div>
            </div>
        </section>

        <section class="form-section">
            <div class="login-card">
                <div class="mobile-logo">
                    <div class="brand-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span>EduPortal</span>
                </div>

                <div class="form-heading">
                    <h2>Welcome back!</h2>
                    <p>Sign in to continue to your student dashboard.</p>
                </div>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="studentId">Student ID</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-id-card"></i>
                            <input type="text" id="studentId" placeholder="Enter your student ID" required />
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="Enter your password" required />
                            <button type="button" id="togglePassword" class="eye-button">
                <i class="fa-regular fa-eye"></i>
              </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>

                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-button">
            Sign In
            <i class="fa-solid fa-arrow-right"></i>
          </button>
                </form>

                <div id="message"></div>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button class="google-button" type="button">
          <i class="fa-brands fa-google"></i>
          Continue with Google
        </button>

                <p class="help-text">
                    Need help?
                    <a href="#">Contact support</a>
                </p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
